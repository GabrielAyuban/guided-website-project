<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>

        body{
            font-family: Arial;
            margin:0;
            background:#f2f2f2;
        }

        header{
            background:#222;
            color:white;
            text-align:center;
            padding:30px;
        }

        nav{
            background:#555;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        section{
            background:white;
            margin:20px;
            padding:20px;
            border-radius:5px;
        }

        input{
            padding:10px;
            width:65%;
        }

        button{
            padding:10px 15px;
            background:#333;
            color:white;
            border:none;
            cursor:pointer;
            margin-left:5px;
        }

        button:hover{
            background:#555;
        }

        ul{
            padding:0;
            margin-top:20px;
        }

        li{
            list-style:none;
            background:#eee;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .deleteBtn{
            background:red;
            padding:5px 10px;
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }

    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Guided Website Development Project</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#recommendations">Recommendations</a>
    </nav>

    <section id="home">
        <h2>Home</h2>
        <p>Welcome to my website.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>I am learning web development using HTML and CSS.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@email.com</p>
        <p>Phone: 0912-345-6789</p>
    </section>

    <section id="recommendations">
        <h2>Recommendations</h2>

        <input type="text" id="recommendInput" placeholder="Enter recommendation">

        <button onclick="addRecommendation()">Add</button>

        <ul id="recommendList">
        </ul>

    </section>

    <footer>
        © 2026 My Website
    </footer>

    <script>

        function addRecommendation(){

            let input = document.getElementById("recommendInput");

            let list = document.getElementById("recommendList");

            if(input.value.trim() === ""){
                alert("Please enter a recommendation.");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            // Recommendation text
            let text = document.createElement("span");
            text.textContent = input.value;

            // Delete button
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "deleteBtn";

            deleteBtn.onclick = function(){
                list.removeChild(li);
            };

            // Add text and button to li
            li.appendChild(text);
            li.appendChild(deleteBtn);

            // Add li to list
            list.appendChild(li);

            // Clear input
            input.value = "";
        }

    </script>

</body>
</html>
